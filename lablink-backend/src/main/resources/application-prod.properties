# ==========================================
# LabLink - PROD Profile (Supabase)
# ==========================================
# All sensitive values injected via environment variables (Railway/Render/Vercel).
# See .env.example for the full list of required variables.

# ── Supabase Transaction Pooler ───────────────────────────────
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP — tuned for PgBouncer transaction pooler ────────
# Transaction pooler does NOT support persistent prepared statements.
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSqlLimit=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── Hibernate ─────────────────────────────────────────────────
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# Suppress JDBC metadata lookup to prevent PgBouncer issues
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Disable server-side prepared statement caching at the Hibernate and JDBC level.
# PgBouncer transaction pooler does NOT persist server-side prepared statements.
# Without this, queries will intermittently fail with 500 Internal Server Error
# ("prepared statement S_N does not exist").
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# DDL: validate in prod — schema changes via Supabase SQL Editor or migrations
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.com.lablink=INFO
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=WARN

# ── Server Port (Render injects PORT env var) ─────────────────
server.port=${PORT:8080}
