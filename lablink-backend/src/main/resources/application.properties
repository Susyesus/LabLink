# ==========================================
# LabLink - Application Properties (Base)
# ==========================================
spring.application.name=lablink-backend

# Profile is set via SPRING_PROFILES_ACTIVE env var.
# Do NOT hardcode a profile here — let the deployment environment decide.
# Default falls through to no profile, which will fail on missing DB vars (correct behavior).

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# Jackson
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ==========================================
# JWT — NO FALLBACK. App fails to start if JWT_SECRET is not set.
# Generate with: openssl rand -base64 32
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

# ==========================================
# Multipart / File Upload
# ==========================================
# Max photo size = 5 MB (enforced in UserService too)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
