# ==========================================
# LabLink - DEV Profile (Supabase)
# ==========================================

# ── Supabase Connection ───────────────────────────────────────
# SSL is appended directly to the JDBC URL — more reliable than
# hikari data-source-properties when using PgBouncer.
# The ?sslmode=require tells the PostgreSQL JDBC driver to enforce SSL.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres.njmfdbirpdnzhgohxhbe}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP — tuned for PgBouncer transaction mode ──────────
# preparedStatementCacheQueries=0: JDBC-level PS caching must be OFF.
# PgBouncer transaction mode does not persist prepared statements
# across connections — any cached PS will return "does not exist" errors.
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSqlLimit=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── Hibernate ─────────────────────────────────────────────────
# Suppress the JDBC metadata lookup Hibernate does on startup —
# this introspection can fail through PgBouncer and is unnecessary
# when ddl-auto=none (we manage schema manually in Supabase).
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Disable server-side prepared statement caching at the Hibernate level.
# PgBouncer transaction pooler does NOT persist server-side prepared statements
# (named "S_1", "S_2"...) across pool hops. Without this, any @Transactional
# read that commits will hit "prepared statement S_N does not exist".
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.lablink=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ── Admin Registration ─────────────────────────────────────────
# Secret key required to create admin accounts via POST /auth/register-admin.
# Override in production with a strong random value.
app.admin.register-secret=${ADMIN_REGISTER_SECRET:lablink-admin-secret-change-me}
